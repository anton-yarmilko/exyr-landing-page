<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exyr visual QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #18191c; background: #e9ebf2; font-family: Inter, system-ui, sans-serif; }
      h1 { margin: 0 0 18px; font-size: 20px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      figure { margin: 0; overflow: hidden; background: #fff; border: 1px solid #d9dce5; border-radius: 14px; box-shadow: 0 12px 32px rgb(24 25 28 / 10%); }
      figcaption { padding: 12px 16px; color: #6e7079; border-bottom: 1px solid #e8eaf0; font-size: 12px; font-weight: 650; }
      img { display: block; width: 100%; height: auto; }
      figure img { aspect-ratio: 820 / 560; object-fit: cover; object-position: top center; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Exyr — source and implementation hero comparison</h1>
    <main>
      <figure><figcaption>Source: public Figma / author case study</figcaption><img src="/qa/figma-hero-reference.png" alt="Exyr source hero reference" /></figure>
      <figure><figcaption>Implementation: local production build</figcaption><img src="/qa/final-desktop-1280x780.png" alt="Current Exyr implementation hero" /></figure>
    </main>
  </body>
</html>
